name: Update stats card

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Generate the card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir card
          python scripts/build_stats.py card/stats.svg

      # The output branch keeps a single commit, so daily updates add no history to main.
      - name: Publish to the output branch
        working-directory: card
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit --quiet --message "chore: update stats card"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
