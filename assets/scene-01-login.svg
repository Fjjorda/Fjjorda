<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 196" width="540" height="196" role="img" aria-label="Terminal login animation that ends with access granted">
<style>
text{font:15.5px ui-monospace,SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace;white-space:pre}
.fg{fill:#E6EDF3}.dim{fill:#8B949E}.ok{fill:#3FB950}.tree{fill:#3FB950}.accent{fill:#58A6FF}
.fire{fill:#FF7B72;font-weight:600}.gold{fill:#E3B341;font-weight:600}
.fox{fill:#F0883E;font-weight:600}.cream{fill:#FFF1DF;font-weight:600}.dark{fill:#C9793F;font-weight:600}
.bgfill{fill:#0D1117}
.line{opacity:0;animation:show .01s linear forwards}
.frame{opacity:0}
.cursor{fill:#E6EDF3;animation:blink 1.1s step-end infinite}
@keyframes show{to{opacity:1}}@keyframes hide{to{opacity:0;visibility:hidden}}
@keyframes type{to{transform:translateX(var(--d))}}
@keyframes blink{50%{opacity:0}}

@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.line{opacity:1!important}.bgfill{display:none}
.walker{transform:none!important}.frame.still{opacity:1}
}
</style>
<rect width="540" height="196" fill="#0D1117"/>
<text x="15.6" y="22" class="dim" textLength="508.8" lengthAdjust="spacing">.-[ fjjorda ]---------------------------------------.</text><text x="15.6" y="40" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="514.8" y="40" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="15.6" y="58" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="514.8" y="58" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="15.6" y="76" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="514.8" y="76" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="15.6" y="94" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="514.8" y="94" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="15.6" y="112" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="514.8" y="112" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="15.6" y="130" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="514.8" y="130" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="15.6" y="148" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="514.8" y="148" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="15.6" y="166" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="514.8" y="166" class="dim" textLength="9.6" lengthAdjust="spacing">|</text><text x="15.6" y="184" class="dim" textLength="508.8" lengthAdjust="spacing">'---------------------------------------------------'</text><g class="login"><g class="line" style="animation-delay:0.58s"><text x="34.8" y="40" class="fg" textLength="259.2" lengthAdjust="spacing">guest@github:~$ ssh fjjorda</text><rect x="188.4" y="26" width="109.6" height="18" class="bgfill" style="--d:105.6px;animation:type 1.1s steps(11) 0.6s forwards"/></g><g class="line" style="animation-delay:2.10s"><text x="34.8" y="58" class="dim" textLength="259.2" lengthAdjust="spacing">Connecting to the forest...</text></g><g class="line" style="animation-delay:2.88s"><text x="34.8" y="94" class="fg" textLength="115.2" lengthAdjust="spacing">login: guest</text><rect x="102.0" y="80" width="52.0" height="18" class="bgfill" style="--d:48.0px;animation:type 0.6s steps(5) 2.9s forwards"/></g><g class="line" style="animation-delay:3.88s"><text x="34.8" y="112" class="fg" textLength="172.8" lengthAdjust="spacing">password: ********</text><rect x="130.8" y="98" width="80.8" height="18" class="bgfill" style="--d:76.8px;animation:type 0.8s steps(8) 3.9s forwards"/></g><g class="line" style="animation-delay:5.20s"><text x="34.8" y="148" class="ok" textLength="144.0" lengthAdjust="spacing">Access granted.</text></g><g class="line" style="animation-delay:5.80s"><rect class="cursor" x="34.8" y="153" width="9" height="16"/></g></g>
</svg>
