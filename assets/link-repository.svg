<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 217.2 62" width="217.2" height="62" role="img" aria-label="view repository">
<style>
text{font:15.5px ui-monospace,SFMono-Regular,Consolas,Menlo,'DejaVu Sans Mono',monospace;white-space:pre}
.fg{fill:#E6EDF3}.dim{fill:#8B949E}.ok{fill:#3FB950}.tree{fill:#3FB950}.accent{fill:#58A6FF}
.fire{fill:#FF7B72;font-weight:600}.gold{fill:#E3B341;font-weight:600}
.fox{fill:#F0883E;font-weight:600}.cream{fill:#FFF1DF;font-weight:600}.dark{fill:#C9793F;font-weight:600}
.bgfill{fill:#0D1117}
.line{opacity:0;animation:show .01s linear forwards}
.frame{opacity:0}
.cursor{fill:#E6EDF3;animation:blink 1.1s step-end infinite}
@keyframes show{to{opacity:1}}@keyframes hide{to{opacity:0;visibility:hidden}}
@keyframes type{to{transform:translateX(var(--d))}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.25}}.marker{animation:pulse 1.6s step-end infinite}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.line{opacity:1!important}.bgfill{display:none}
.walker{transform:none!important}.frame.still{opacity:1}
}
</style>
<rect width="217.2" height="62" fill="#0D1117"/>
<text x="3.0" y="16" class="accent" textLength="211.2" lengthAdjust="spacing">.--------------------.</text><text x="3.0" y="34" class="accent" textLength="9.6" lengthAdjust="spacing">|</text><g class="marker"><text x="22.2" y="34" class="accent" textLength="9.6" lengthAdjust="spacing">&gt;</text></g><text x="41.4" y="34" class="fg" textLength="144.0" lengthAdjust="spacing">view repository</text><text x="204.6" y="34" class="accent" textLength="9.6" lengthAdjust="spacing">|</text><text x="3.0" y="52" class="accent" textLength="211.2" lengthAdjust="spacing">'--------------------'</text>
</svg>
